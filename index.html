<script>
// ---------- window.storage polyfill (localStorage-backed, with in-memory fallback) ----------
// Mirrors the get/set/delete/list interface the app was originally built
// against, so the app code itself needs no changes. "shared" is accepted
// for interface compatibility but is not meaningful outside that original
// environment — everything here is local to this browser only.
//
// Some browsing contexts (Private Browsing, certain in-app webviews, storage
// quota set to 0) make localStorage.setItem throw on every call. Rather than
// showing a permanent "save failed" error in that case, we detect it once
// up front and fall back to an in-memory store so the app still works for
// the current session — it just won't survive a reload in that situation.
(function () {
  const PREFIX = "little-steps:";
  const k = (key) => PREFIX + key;

  let localStorageWorks = true;
  try {
    const testKey = k("__test__");
    localStorage.setItem(testKey, "1");
    localStorage.removeItem(testKey);
  } catch (e) {
    localStorageWorks = false;
  }

  const memoryStore = new Map();

  window.storage = {
    async get(key) {
      const raw = localStorageWorks ? localStorage.getItem(k(key)) : (memoryStore.has(k(key)) ? memoryStore.get(k(key)) : null);
      if (raw === null || raw === undefined) return null;
      return { key, value: raw, shared: false };
    },
    async set(key, value) {
      try {
        if (localStorageWorks) {
          localStorage.setItem(k(key), value);
        } else {
          memoryStore.set(k(key), value);
        }
        return { key, value, shared: false };
      } catch (e) {
        // localStorage started failing mid-session (e.g. quota hit) — degrade
        // to memory for the rest of this session instead of erroring forever.
        localStorageWorks = false;
        memoryStore.set(k(key), value);
        return { key, value, shared: false };
      }
    },
    async delete(key) {
      if (localStorageWorks) localStorage.removeItem(k(key));
      memoryStore.delete(k(key));
      return { key, deleted: true, shared: false };
    },
    async list(prefix) {
      const source = localStorageWorks ? Object.keys(localStorage) : Array.from(memoryStore.keys());
      const keys = source
        .filter((full) => full.startsWith(PREFIX + (prefix || "")))
        .map((full) => full.slice(PREFIX.length));
      return { keys, prefix, shared: false };
    },
  };
})();


</script>

<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;

// ---------- lightweight inline icon set (replaces lucide-react for a build-free static page) ----------
const ICON_PATHS = {
  plus: <path d="M12 5v14M5 12h14" />,
  x: <path d="M18 6 6 18M6 6l12 12" />,
  check: <path d="m5 13 4 4L19 7" />,
  chevronLeft: <path d="m15 18-6-6 6-6" />,
  chevronRight: <path d="m9 18 6-6-6-6" />,
  arrowRight: <path d="M5 12h14M13 5l7 7-7 7" />,
  pause: <><rect x="6" y="4" width="4" height="16" rx="1" /><rect x="14" y="4" width="4" height="16" rx="1" /></>,
  rotateCcw: <path d="M4 4v6h6M20 13a8 8 0 1 1-2.6-6.9L20 10" />,
  trash2: <path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6" />,
  target: <><circle cx="12" cy="12" r="9" /><circle cx="12" cy="12" r="5.2" /><circle cx="12" cy="12" r="1.4" /></>,
  ruler: <><rect x="3" y="8" width="18" height="8" rx="1.5" /><path d="M7 8v3M11 8v3M15 8v3" /></>,
  listChecks: <path d="M4 6h1M8 6h12M4 12h1M8 12h12M4 18h1M8 18h12" />,
  calendarClock: <><rect x="3" y="5" width="14" height="16" rx="2" /><path d="M3 10h14M7 3v4" /><circle cx="17" cy="17" r="5" /><path d="M17 15v2l1.4 1" /></>,
  smartphone: <><rect x="7" y="2" width="10" height="20" rx="2" /><path d="M11 18h2" /></>,
  moreVertical: <><circle cx="12" cy="5" r="1.3" /><circle cx="12" cy="12" r="1.3" /><circle cx="12" cy="19" r="1.3" /></>,
};

// Filled-only shapes (drawn with fill, no stroke needed for the shape itself)
const FILLED_PATHS = {
  play: <path d="M8 5v14l11-7z" />,
  flame: <path d="M12 2.5c.6 3.2-2.6 4.3-2.6 7.6a2.6 2.6 0 0 0 5.2 0c0-.9-.4-1.4-.8-2.1.7 1.6-.3 2.6-1.2 2-.1-2.4 1.6-3.9-.6-7.5zM7.4 12.3A6.6 6.6 0 0 0 12 21a6.6 6.6 0 0 0 4.6-8.7 4.6 4.6 0 0 1-9.2 0z" />,
  sparkles: <path d="M12 3l1.4 4.6L18 9l-4.6 1.4L12 15l-1.4-4.6L6 9l4.6-1.4zM19 15l.7 2.3L22 18l-2.3.7L19 21l-.7-2.3L16 18l2.3-.7zM5 14l.6 2 2 .6-2 .6-.6 2-.6-2-2-.6 2-.6z" />,
  rocket: <path d="M12 2.2c2.6 2 4.3 5.4 4.3 9 0 1.7-.6 3.3-1.5 4.5l-2.8 3-2.8-3c-.9-1.2-1.5-2.8-1.5-4.5 0-3.6 1.7-7 4.3-9zM9.3 16.4 7 19.3l.7-3.4M14.7 16.4l2.3 2.9-.7-3.4M12 11a1.7 1.7 0 1 0 0-3.4A1.7 1.7 0 0 0 12 11z" />,
  heart: <path d="M12 20.5s-7-4.2-9.3-8.4C.9 8.7 2.8 5.3 6.2 5.3c2 0 3.5 1.1 4 2 .5-.9 2-2 4-2 3.4 0 5.3 3.4 3.5 6.8C19 16.3 12 20.5 12 20.5z" />,
  share2: <><circle cx="18" cy="5" r="2.4" /><circle cx="6" cy="12" r="2.4" /><circle cx="18" cy="19" r="2.4" /><path d="m8.1 10.7 7.8-4.4M8.1 13.3l7.8 4.4" strokeWidth="2" /></>,
};

function Icon({ name, size = 24, color = "currentColor", fill, strokeWidth = 2, className, style }) {
  const isFilled = name in FILLED_PATHS;
  return (
    <svg
      width={size}
      height={size}
      viewBox="0 0 24 24"
      fill={isFilled ? (fill || color) : (fill && fill !== "none" ? fill : "none")}
      stroke={isFilled ? "none" : color}
      strokeWidth={strokeWidth}
      strokeLinecap="round"
      strokeLinejoin="round"
      className={className}
      style={style}
      aria-hidden="true"
    >
      {isFilled ? FILLED_PATHS[name] : ICON_PATHS[name]}
    </svg>
  );
}

const iconEl = (name) => (props) => <Icon name={name} {...props} />;

const Plus = iconEl("plus");
const X = iconEl("x");
const Check = iconEl("check");
const ChevronLeft = iconEl("chevronLeft");
const ChevronRight = iconEl("chevronRight");
const ArrowRight = iconEl("arrowRight");
const Play = iconEl("play");
const Pause = iconEl("pause");
const Flame = iconEl("flame");
const Sparkles = iconEl("sparkles");
const RotateCcw = iconEl("rotateCcw");
const Trash2 = iconEl("trash2");
const Rocket = iconEl("rocket");
const Target = iconEl("target");
const Ruler = iconEl("ruler");
const ListChecks = iconEl("listChecks");
const Heart = iconEl("heart");
const CalendarClock = iconEl("calendarClock");
const Smartphone = iconEl("smartphone");
const Share2 = iconEl("share2");
const MoreVertical = iconEl("moreVertical");
const Clock = iconEl("calendarClock");

// ---------- helpers ----------
const uid = () => Math.random().toString(36).slice(2, 10);
const todayStr = () => new Date().toISOString().slice(0, 10);
const daysUntil = (dateStr) => {
  if (!dateStr) return null;
  const d = new Date(dateStr + "T00:00:00");
  const now = new Date();
  now.setHours(0, 0, 0, 0);
  return Math.ceil((d - now) / 86400000);
};

const EMPTY_DATA = { goals: [], streak: { count: 0, lastActiveDate: null } };

// Tracks the *visible* viewport height (window.visualViewport), which shrinks
// correctly when the on-screen keyboard opens — unlike 100vh/100dvh in some
// mobile browsers. Used so full-screen overlays never get pushed off-screen.
function useVisibleHeight() {
  const [h, setH] = useState(() =>
    typeof window !== "undefined" ? (window.visualViewport ? window.visualViewport.height : window.innerHeight) : 800
  );
  useEffect(() => {
    const vv = window.visualViewport;
    if (!vv) return;
    const update = () => setH(vv.height);
    update();
    vv.addEventListener("resize", update);
    vv.addEventListener("scroll", update);
    return () => {
      vv.removeEventListener("resize", update);
      vv.removeEventListener("scroll", update);
    };
  }, []);
  return h;
}

const WIZARD_STEPS = [
  { key: "specific", label: "Specific", eyebrow: "S", prompt: "何を達成したい?", hint: "できるだけ具体的に、一文で。", icon: Target, color: "#6C5CE7" },
  { key: "measurable", label: "Measurable", eyebrow: "M", prompt: "終わったって、どうやってわかる?", hint: "数字や状態で書けると迷わない。", icon: Ruler, color: "#3D9BE9" },
  { key: "subtasks", label: "Achievable", eyebrow: "A", prompt: "25分以内で終わる小さな一歩に分けよう", hint: "3〜6個くらい。小さいほど始めやすい。", icon: ListChecks, color: "#FF7A59" },
  { key: "relevant", label: "Relevant", eyebrow: "R", prompt: "これが今の自分にとって大事な理由は?", hint: "あとで気力が切れたときに読み返す用。", icon: Heart, color: "#FF6B9D" },
  { key: "timebound", label: "Time-bound", eyebrow: "T", prompt: "いつまでにやる?", hint: "締切がないと脳が優先度を見失う。", icon: CalendarClock, color: "#2EC4B6" },
];

const TIMER_PRESETS = [5, 15, 25, 30, 40];

function App() {
  const [data, setData] = useState(EMPTY_DATA);
  const [loaded, setLoaded] = useState(false);
  const [wizardOpen, setWizardOpen] = useState(false);
  const [wizardStep, setWizardStep] = useState(0);
  const [wizardData, setWizardData] = useState(blankWizard());
  const [activeTimer, setActiveTimer] = useState(null); // { goalId, subId, seconds, running }
  const [celebrate, setCelebrate] = useState(null);
  const [saveError, setSaveError] = useState(false);
  const [installGuideOpen, setInstallGuideOpen] = useState(false);
  const [isStandalone] = useState(
    () =>
      typeof window !== "undefined" &&
      ((window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true)
  );
  const tickRef = useRef(null);

  function blankWizard() {
    return { specific: "", measurable: "", subtasks: [], relevant: "", timebound: "" };
  }

  // ---- load ----
  useEffect(() => {
    (async () => {
      try {
        const res = await window.storage.get("smart-goals-data", false);
        if (res && res.value) {
          const parsed = JSON.parse(res.value);
          setData({ goals: parsed.goals || [], streak: parsed.streak || { count: 0, lastActiveDate: null } });
        }
      } catch (e) {
        // no data yet, that's fine
      } finally {
        setLoaded(true);
      }
    })();
  }, []);

  const persist = useCallback(async (next, attempt = 0) => {
    try {
      const ok = await window.storage.set("smart-goals-data", JSON.stringify(next), false);
      if (ok) {
        setSaveError(false);
      } else if (attempt < 2) {
        setTimeout(() => persist(next, attempt + 1), 600);
      } else {
        setSaveError(true);
      }
    } catch (e) {
      if (attempt < 2) {
        setTimeout(() => persist(next, attempt + 1), 600);
      } else {
        setSaveError(true);
      }
    }
  }, []);

  const isEmptyData = data.goals.length === 0 && data.streak.count === 0;

  useEffect(() => {
    // avoid a pointless save (and pointless error) before the user has done anything
    if (loaded && !isEmptyData) persist(data);
  }, [data, loaded, isEmptyData, persist]);

  // ---- timer tick ----
  useEffect(() => {
    if (activeTimer && activeTimer.running) {
      tickRef.current = setInterval(() => {
        setActiveTimer((t) => {
          if (!t) return t;
          if (t.seconds <= 1) {
            clearInterval(tickRef.current);
            return { ...t, seconds: 0, running: false, done: true };
          }
          return { ...t, seconds: t.seconds - 1 };
        });
      }, 1000);
      return () => clearInterval(tickRef.current);
    }
    return () => clearInterval(tickRef.current);
  }, [activeTimer && activeTimer.running]);

  // ---- streak ----
  const bumpStreak = (current) => {
    const t = todayStr();
    if (current.lastActiveDate === t) return current;
    const yesterday = new Date();
    yesterday.setDate(yesterday.getDate() - 1);
    const wasYesterday = current.lastActiveDate === yesterday.toISOString().slice(0, 10);
    return { count: wasYesterday ? current.count + 1 : 1, lastActiveDate: t };
  };

  // ---- wizard ----
  const openWizard = () => { setWizardData(blankWizard()); setWizardStep(0); setWizardOpen(true); };
  const closeWizard = () => setWizardOpen(false);

  const canAdvance = () => {
    const key = WIZARD_STEPS[wizardStep].key;
    if (key === "subtasks") return wizardData.subtasks.length > 0;
    if (key === "relevant") return true; // optional, don't block momentum
    return wizardData[key].trim().length > 0;
  };

  const finishWizard = () => {
    const goal = {
      id: uid(),
      title: wizardData.specific.trim(),
      measurable: wizardData.measurable.trim(),
      relevant: wizardData.relevant.trim(),
      deadline: wizardData.timebound,
      createdAt: todayStr(),
      subtasks: wizardData.subtasks.map((s) => ({ id: uid(), text: s, done: false })),
    };
    setData((d) => ({ ...d, goals: [goal, ...d.goals] }));
    setWizardOpen(false);
  };

  // ---- subtask actions ----
  const [pendingGoalDone, setPendingGoalDone] = useState(null); // { goalId, subId, title }
  const goalDoneTimerRef = useRef(null);

  const toggleSubtask = (goalId, subId, forceDone) => {
    setData((d) => {
      let wholeGoalJustCompleted = null;
      const goals = d.goals.map((g) => {
        if (g.id !== goalId) return g;
        const subtasks = g.subtasks.map((s) =>
          s.id === subId ? { ...s, done: forceDone !== undefined ? forceDone : !s.done } : s
        );
        if (subtasks.length > 0 && subtasks.every((s) => s.done) && !g.subtasks.every((s) => s.done)) {
          wholeGoalJustCompleted = g.title;
        }
        return { ...g, subtasks };
      });
      const justCompleted = forceDone === true || (forceDone === undefined &&
        d.goals.find((g) => g.id === goalId)?.subtasks.find((s) => s.id === subId)?.done === false);

      if (wholeGoalJustCompleted) {
        setPendingGoalDone({ goalId, subId, title: wholeGoalJustCompleted });
        if (goalDoneTimerRef.current) clearTimeout(goalDoneTimerRef.current);
        goalDoneTimerRef.current = setTimeout(() => setPendingGoalDone(null), 8000);
      }

      return { ...d, goals, streak: justCompleted ? bumpStreak(d.streak) : d.streak };
    });
  };

  const undoGoalDone = () => {
    if (!pendingGoalDone) return;
    toggleSubtask(pendingGoalDone.goalId, pendingGoalDone.subId, false);
    if (goalDoneTimerRef.current) clearTimeout(goalDoneTimerRef.current);
    setPendingGoalDone(null);
  };

  // Always-available (not time-limited) way back for a goal already archived as done —
  // reopens it by un-marking its last step, since the toast above only lasts a few seconds.
  const reopenGoal = (goalId) => {
    setData((d) => ({
      ...d,
      goals: d.goals.map((g) => {
        if (g.id !== goalId || g.subtasks.length === 0) return g;
        const lastIdx = g.subtasks.length - 1;
        return { ...g, subtasks: g.subtasks.map((s, i) => (i === lastIdx ? { ...s, done: false } : s)) };
      }),
    }));
  };

  const [pendingDelete, setPendingDelete] = useState(null); // { goal, index }
  const undoTimerRef = useRef(null);

  const deleteGoal = (goalId) => {
    setData((d) => {
      const index = d.goals.findIndex((g) => g.id === goalId);
      if (index === -1) return d;
      const goal = d.goals[index];
      setPendingDelete({ goal, index });
      if (undoTimerRef.current) clearTimeout(undoTimerRef.current);
      undoTimerRef.current = setTimeout(() => setPendingDelete(null), 6000);
      return { ...d, goals: d.goals.filter((g) => g.id !== goalId) };
    });
  };

  const undoDelete = () => {
    if (!pendingDelete) return;
    setData((d) => {
      const goals = [...d.goals];
      goals.splice(Math.min(pendingDelete.index, goals.length), 0, pendingDelete.goal);
      return { ...d, goals };
    });
    if (undoTimerRef.current) clearTimeout(undoTimerRef.current);
    setPendingDelete(null);
  };

  // ---- timer actions ----
  const startTimer = (goalId, subId, minutes) => {
    setActiveTimer({ goalId, subId, seconds: minutes * 60, total: minutes * 60, running: true, done: false });
  };
  const pauseResume = () => setActiveTimer((t) => t && { ...t, running: !t.running });
  const cancelTimer = () => setActiveTimer(null);
  const finishTimerMarkDone = () => {
    if (activeTimer) {
      toggleSubtask(activeTimer.goalId, activeTimer.subId, true);
      const goal = data.goals.find((g) => g.id === activeTimer.goalId);
      setCelebrate(goal ? goal.title : "one step");
      setTimeout(() => setCelebrate(null), 2200);
    }
    setActiveTimer(null);
  };

  const activeGoals = data.goals.filter((g) => g.subtasks.some((s) => !s.done) || g.subtasks.length === 0);
  const doneGoals = data.goals.filter((g) => g.subtasks.length > 0 && g.subtasks.every((s) => s.done));

  return (
    <div className="min-h-screen w-full" style={{ background: "#F6F4FF", color: "#211F3A", fontFamily: "'Inter', sans-serif" }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap');
        .font-display { font-family: 'Fredoka', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        @keyframes pop { 0% { transform: scale(0.85); opacity: 0; } 60% { transform: scale(1.05); opacity: 1; } 100% { transform: scale(1); } }
        @keyframes floatUp { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-14px); opacity: 0; } }
        @keyframes pulseRing { 0%, 100% { box-shadow: 0 0 0 0 rgba(255,122,89,0.35); } 50% { box-shadow: 0 0 0 8px rgba(255,122,89,0); } }
        @keyframes descend { 0% { transform: translateY(-32px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
        @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-4px) rotate(2deg); } }
        @keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
        .animate-pop { animation: pop 0.35s ease-out; }
        .animate-descend { animation: descend 0.4s cubic-bezier(0.22, 1, 0.36, 1); }
        .animate-bob { animation: bob 2.4s ease-in-out infinite; }
        .animate-fade-in { animation: fadeIn 0.25s ease-out; }
        .pulse-ring { animation: pulseRing 1.8s ease-in-out infinite; }
        @media (prefers-reduced-motion: reduce) {
          .animate-pop, .pulse-ring, .animate-descend, .animate-bob, .animate-fade-in { animation: none !important; }
        }
        button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid #6C5CE7; outline-offset: 2px; }
        /* iOS Safari auto-zooms the whole page when a focused input's font-size is under 16px.
           Forcing 16px here (independent of Tailwind's text-sm class) stops that jump. */
        input, textarea, select { font-size: 16px !important; }
        html { -webkit-text-size-adjust: 100%; }
      `}</style>

      {/* header */}
      <header className="sticky top-0 z-20 backdrop-blur border-b" style={{ background: "rgba(246,244,255,0.85)", borderColor: "#E4E0FA", paddingTop: "env(safe-area-inset-top)" }}>
        <div className="max-w-3xl mx-auto px-5 py-4 flex items-center justify-between">
          <div className="flex items-center gap-2">
            <div className="w-9 h-9 rounded-2xl flex items-center justify-center" style={{ background: "#6C5CE7" }}>
              <Target size={18} color="white" strokeWidth={2.5} />
            </div>
            <span className="font-display text-xl font-semibold tracking-tight">little steps</span>
          </div>
          <div className="flex items-center gap-2">
            {!isStandalone && (
              <button
                onClick={() => setInstallGuideOpen(true)}
                aria-label="ホーム画面に追加"
                className="w-9 h-9 rounded-full flex items-center justify-center transition-colors"
                style={{ background: "#EDEAFB" }}
              >
                <Smartphone size={16} color="#6C5CE7" />
              </button>
            )}
            <div className="flex items-center gap-1.5 px-3 py-1.5 rounded-full" style={{ background: data.streak.count > 0 ? "#FFF1D6" : "#EDEAFB" }}>
              <Flame size={16} color={data.streak.count > 0 ? "#FF9F1C" : "#9891C4"} fill={data.streak.count > 0 ? "#FFD166" : "none"} />
              <span className="font-mono text-sm font-bold" style={{ color: data.streak.count > 0 ? "#B4690E" : "#9891C4" }}>
                {data.streak.count}
              </span>
            </div>
          </div>
        </div>
      </header>

      <main className="max-w-3xl mx-auto px-5 pb-28 pt-6">
        {!loaded ? (
          <div className="py-24 text-center text-sm" style={{ color: "#9891C4" }}>読み込み中…</div>
        ) : data.goals.length === 0 ? (
          <EmptyState onStart={openWizard} />
        ) : (
          <>
            <section className="space-y-5">
              {activeGoals.map((g) => (
                <GoalCard
                  key={g.id}
                  goal={g}
                  onToggle={(subId) => toggleSubtask(g.id, subId)}
                  onStartTimer={(subId, min) => startTimer(g.id, subId, min)}
                  onDelete={() => deleteGoal(g.id)}
                />
              ))}
            </section>

            {doneGoals.length > 0 && (
              <section className="mt-10">
                <h2 className="font-display text-sm font-semibold mb-3 flex items-center gap-1.5" style={{ color: "#9891C4" }}>
                  <Sparkles size={14} /> やり切った目標 ({doneGoals.length})
                </h2>
                <div className="space-y-2">
                  {doneGoals.map((g) => (
                    <div key={g.id} className="flex items-center justify-between gap-2 px-4 py-3 rounded-2xl" style={{ background: "#EAF9F6" }}>
                      <div className="flex items-center gap-2 min-w-0">
                        <Check size={16} color="#2EC4B6" className="shrink-0" />
                        <span className="text-sm truncate line-through" style={{ color: "#4B7B75" }}>{g.title}</span>
                      </div>
                      <div className="flex items-center gap-1 shrink-0">
                        <button
                          onClick={() => reopenGoal(g.id)}
                          className="flex items-center gap-1 text-xs font-semibold px-2.5 py-1.5 rounded-lg hover:bg-white/60 transition-colors"
                          style={{ color: "#2E9187" }}
                          aria-label="達成前の状態に戻す"
                        >
                          <RotateCcw size={13} /> 元に戻す
                        </button>
                        <button onClick={() => deleteGoal(g.id)} className="p-1.5 rounded-lg hover:bg-white/60 transition-colors" aria-label="削除">
                          <Trash2 size={14} color="#4B7B75" />
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </section>
            )}
          </>
        )}
      </main>

      {/* floating add button */}
      <button
        onClick={openWizard}
        className="fixed right-6 z-30 rounded-full shadow-lg flex items-center gap-2 px-5 py-3.5 font-display font-semibold text-white transition-transform hover:scale-105 active:scale-95"
        style={{ background: "linear-gradient(135deg, #FF7A59, #FF9F6E)", bottom: "calc(1.5rem + env(safe-area-inset-bottom))" }}
      >
        <Plus size={20} strokeWidth={2.5} />
        目標をつくる
      </button>

      {wizardOpen && (
        <Wizard
          step={wizardStep}
          setStep={setWizardStep}
          data={wizardData}
          setData={setWizardData}
          onClose={closeWizard}
          onFinish={finishWizard}
          canAdvance={canAdvance()}
        />
      )}

      {activeTimer && (
        <TimerOverlay
          timer={activeTimer}
          onPauseResume={pauseResume}
          onCancel={cancelTimer}
          onFinish={finishTimerMarkDone}
          onKeepGoing={() => setActiveTimer(null)}
          goalTitle={data.goals.find((g) => g.id === activeTimer.goalId)?.title}
          subText={data.goals.find((g) => g.id === activeTimer.goalId)?.subtasks.find((s) => s.id === activeTimer.subId)?.text}
        />
      )}

      {installGuideOpen && <InstallGuide onClose={() => setInstallGuideOpen(false)} />}

      {celebrate && <Celebration text={celebrate} />}

      {pendingDelete && (
        <UndoToast
          message={`「${pendingDelete.goal.title}」を削除しました`}
          icon={Trash2}
          onUndo={undoDelete}
          onDismiss={() => { if (undoTimerRef.current) clearTimeout(undoTimerRef.current); setPendingDelete(null); }}
        />
      )}

      {pendingGoalDone && !pendingDelete && (
        <UndoToast
          message={`「${pendingGoalDone.title}」を達成しました!`}
          icon={Sparkles}
          onUndo={undoGoalDone}
          onDismiss={() => { if (goalDoneTimerRef.current) clearTimeout(goalDoneTimerRef.current); setPendingGoalDone(null); }}
        />
      )}

      {saveError && (
        <div className="fixed bottom-6 left-6 z-40 px-4 py-2.5 rounded-xl text-sm font-medium" style={{ background: "#FFE5E0", color: "#C4432B" }}>
          保存に失敗しました。もう一度試してください。
        </div>
      )}
    </div>
  );
}

      <h1 className="font-display text-2xl font-semibold mb-2">まだ目標がありません</h1>

// ---------- Goal card with step-path ----------
function GoalCard({ goal, onToggle, onStartTimer, onDelete }) {
  const [pickingFor, setPickingFor] = useState(null);
  const doneCount = goal.subtasks.filter((s) => s.done).length;
  const total = goal.subtasks.length;
  const nextIdx = goal.subtasks.findIndex((s) => !s.done);
  const remain = daysUntil(goal.deadline);

  return (
    <div className="rounded-3xl p-5" style={{ background: "white", boxShadow: "0 1px 3px rgba(76,63,140,0.08), 0 1px 2px rgba(76,63,140,0.06)" }}>
      <div className="flex items-start justify-between gap-3 mb-1">
        <h3 className="font-display text-lg font-semibold leading-snug">{goal.title}</h3>
        <button onClick={onDelete} className="shrink-0 p-1.5 rounded-lg hover:bg-[#F6F4FF] transition-colors" aria-label="目標を削除">
          <Trash2 size={15} color="#B7B0DE" />
        </button>
      </div>
      {goal.measurable && (
        <p className="text-sm mb-3" style={{ color: "#726B9E" }}>{goal.measurable}</p>
      )}

      <div className="flex items-center gap-3 mb-4 text-xs font-medium" style={{ color: "#9891C4" }}>
        <span>{doneCount}/{total} ステップ完了</span>
        {remain !== null && (
          <span className="px-2 py-0.5 rounded-full" style={{ background: remain < 0 ? "#FFE5E0" : remain <= 3 ? "#FFF1D6" : "#EDEAFB", color: remain < 0 ? "#C4432B" : remain <= 3 ? "#B4690E" : "#6C5CE7" }}>
            {remain < 0 ? `${Math.abs(remain)}日超過` : remain === 0 ? "今日が締切" : `あと${remain}日`}
          </span>
        )}
      </div>

      {/* path — decorative progress indicator only, not tappable, to avoid mistaken completions */}
      {total > 0 && (
        <div className="relative">
          <div className="flex items-center" aria-hidden="true">
            {goal.subtasks.map((s, i) => (
              <div key={s.id} className="flex items-center flex-1 last:flex-none">
                <div
                  className={`w-8 h-8 rounded-full flex items-center justify-center transition-all ${i === nextIdx ? "pulse-ring" : ""}`}
                  style={{
                    background: s.done ? "#2EC4B6" : i === nextIdx ? "#FF7A59" : "#EDEAFB",
                  }}
                >
                  {s.done ? <Check size={15} color="white" strokeWidth={3} /> : (
                    <span className="text-xs font-bold font-mono" style={{ color: i === nextIdx ? "white" : "#9891C4" }}>{i + 1}</span>
                  )}
                </div>
                {i < goal.subtasks.length - 1 && (
                  <div className="h-0.5 flex-1 mx-1 rounded" style={{ background: s.done ? "#2EC4B6" : "#EDEAFB" }} />
                )}
              </div>
            ))}
          </div>

          <div className="mt-3 space-y-1.5">
            {goal.subtasks.map((s, i) => (
              <div key={s.id} className="flex items-center gap-2 px-3 py-2 rounded-xl" style={{ background: i === nextIdx && !s.done ? "#FFF4F0" : "transparent" }}>
                <button
                  onClick={() => onToggle(s.id)}
                  aria-label={s.done ? "完了を取り消す" : "完了にする"}
                  className="shrink-0 w-6 h-6 rounded-full flex items-center justify-center border-2 transition-colors"
                  style={{ borderColor: s.done ? "#2EC4B6" : "#D8D3F4", background: s.done ? "#2EC4B6" : "white" }}
                >
                  {s.done && <Check size={13} color="white" strokeWidth={3.5} />}
                </button>
                <span className={`text-sm flex-1 ${s.done ? "line-through" : ""}`} style={{ color: s.done ? "#B7B0DE" : "#3A3660" }}>{s.text}</span>
                {!s.done && (
                  <button
                    onClick={() => setPickingFor(pickingFor === s.id ? null : s.id)}
                    className="shrink-0 flex items-center gap-1 text-xs font-semibold px-2.5 py-1 rounded-lg transition-colors"
                    style={{ background: i === nextIdx ? "#FF7A59" : "#EDEAFB", color: i === nextIdx ? "white" : "#6C5CE7" }}
                  >
                    <Play size={11} fill="currentColor" /> 開始
                  </button>
                )}
              </div>
            ))}
          </div>

          {pickingFor && (
            <div className="mt-2 flex flex-wrap items-center gap-2 px-3">
              <span className="text-xs w-full sm:w-auto" style={{ color: "#9891C4" }}>時間を選ぶ:</span>
              {TIMER_PRESETS.map((m) => (
                <button
                  key={m}
                  onClick={() => { onStartTimer(pickingFor, m); setPickingFor(null); }}
                  className="text-xs font-mono font-bold px-2.5 py-1.5 rounded-lg"
                  style={{ background: "#EDEAFB", color: "#6C5CE7" }}
                >
                  {m}分
                </button>
              ))}
            </div>
          )}
        </div>
      )}

      {goal.relevant && (
        <p className="mt-4 pt-3 text-xs italic border-t" style={{ color: "#B7B0DE", borderColor: "#F0EEFB" }}>
          "{goal.relevant}"
        </p>
      )}
    </div>
  );
}

// ---------- Wizard ----------
function Wizard({ step, setStep, data, setData, onClose, onFinish, canAdvance }) {
  const cfg = WIZARD_STEPS[step];
  const [draftSub, setDraftSub] = useState("");
  const isLast = step === WIZARD_STEPS.length - 1;

  const next = () => (isLast ? onFinish() : setStep(step + 1));
  const back = () => (step === 0 ? onClose() : setStep(step - 1));

  const addSub = () => {
    const t = draftSub.trim();
    if (!t) return;
    setData((d) => ({ ...d, subtasks: [...d.subtasks, t] }));
    setDraftSub("");
  };
  const removeSub = (i) => setData((d) => ({ ...d, subtasks: d.subtasks.filter((_, idx) => idx !== i) }));
  const vh = useVisibleHeight();
  const Icon = cfg.icon;

  return (
    <div
      className="fixed left-0 right-0 top-0 z-40 flex items-start justify-center overflow-y-auto"
      style={{ height: vh, background: "rgba(33,31,58,0.5)", paddingTop: "env(safe-area-inset-top)" }}
    >
      <div
        key={cfg.key}
        className="w-full sm:max-w-lg bg-white rounded-b-3xl sm:rounded-3xl sm:mt-10 animate-descend flex flex-col relative"
        style={{ maxHeight: Math.round(vh * 0.94), boxShadow: "0 20px 50px rgba(33,31,58,0.35)" }}
      >
        <button
          onClick={onClose}
          aria-label="閉じる"
          className="absolute top-4 right-4 z-10 w-8 h-8 rounded-full flex items-center justify-center transition-colors hover:bg-black/5"
        >
          <X size={17} color="#B7B0DE" />
        </button>

        <div className="overflow-y-auto px-6 pt-7" style={{ paddingBottom: "1.5rem" }}>
          {/* progress dots */}
          <div className="flex items-center gap-1.5 mb-6 pr-8">
            {WIZARD_STEPS.map((s, i) => (
              <div key={s.key} className="flex-1 h-1.5 rounded-full transition-colors" style={{ background: i <= step ? s.color : "#EDEAFB" }} />
            ))}
          </div>

          {/* guide character */}
          <div className="flex flex-col items-center text-center mb-5 animate-fade-in">
            <div
              className="w-16 h-16 rounded-3xl flex items-center justify-center mb-3 animate-bob"
              style={{ background: cfg.color }}
            >
              <Icon size={28} color="white" strokeWidth={2.2} />
            </div>
            <div className="flex items-center gap-1.5 mb-2">
              <span className="font-mono text-xs font-bold px-1.5 py-0.5 rounded" style={{ background: "#F6F4FF", color: cfg.color }}>{cfg.eyebrow}</span>
              <span className="text-xs font-semibold" style={{ color: "#9891C4" }}>{cfg.label} · {step + 1}/{WIZARD_STEPS.length}</span>
            </div>
            <h2 className="font-display text-xl font-semibold leading-snug">{cfg.prompt}</h2>
            <p className="text-sm mt-1" style={{ color: "#9891C4" }}>{cfg.hint}</p>
          </div>

          {cfg.key === "subtasks" ? (
            <div>
              <div className="flex gap-2 mb-3">
                <input
                  autoFocus
                  value={draftSub}
                  onChange={(e) => setDraftSub(e.target.value)}
                  onKeyDown={(e) => e.key === "Enter" && addSub()}
                  placeholder="例: 参考資料を1つ開く"
                  className="flex-1 px-4 py-3 rounded-xl border-2 outline-none"
                  style={{ borderColor: "#EDEAFB" }}
                />
                <button onClick={addSub} className="px-4 rounded-xl font-semibold text-sm shrink-0" style={{ background: cfg.color, color: "white" }}>追加</button>
              </div>
              <div className="space-y-2">
                {data.subtasks.map((s, i) => (
                  <div key={i} className="flex items-center justify-between px-3 py-2 rounded-xl" style={{ background: "#F6F4FF" }}>
                    <span className="text-sm flex items-center gap-2">
                      <span className="font-mono text-xs font-bold" style={{ color: "#9891C4" }}>{i + 1}</span>
                      {s}
                    </span>
                    <button onClick={() => removeSub(i)} aria-label="削除" className="p-1"><X size={15} color="#B7B0DE" /></button>
                  </div>
                ))}
              </div>
            </div>
          ) : cfg.key === "timebound" ? (
            <input
              type="date"
              autoFocus
              value={data.timebound}
              onChange={(e) => setData((d) => ({ ...d, timebound: e.target.value }))}
              className="w-full px-4 py-3 rounded-xl border-2 outline-none"
              style={{ borderColor: "#EDEAFB" }}
            />
          ) : (
            <textarea
              autoFocus
              value={data[cfg.key]}
              onChange={(e) => setData((d) => ({ ...d, [cfg.key]: e.target.value }))}
              placeholder="ここに入力…"
              rows={cfg.key === "relevant" ? 3 : 2}
              className="w-full px-4 py-3 rounded-xl border-2 outline-none resize-none"
              style={{ borderColor: "#EDEAFB" }}
            />
          )}
        </div>

        <div
          className="flex items-center justify-between px-6 py-4 border-t shrink-0"
          style={{ borderColor: "#F0EEFB", paddingBottom: "calc(1rem + env(safe-area-inset-bottom))" }}
        >
          <button onClick={back} className="flex items-center gap-1 text-sm font-semibold px-4 py-2.5 rounded-xl" style={{ color: "#9891C4" }}>
            <ChevronLeft size={16} /> {step === 0 ? "閉じる" : "戻る"}
          </button>
          <button
            onClick={next}
            disabled={!canAdvance}
            className="flex items-center gap-1.5 font-display font-semibold px-5 py-2.5 rounded-xl text-white transition-opacity disabled:opacity-40"
            style={{ background: isLast ? "#2EC4B6" : cfg.color }}
          >
            {isLast ? "目標をつくる" : "次へ"} <ArrowRight size={16} />
          </button>
        </div>
      </div>
    </div>
  );
}

// ---------- Timer overlay ----------
function TimerOverlay({ timer, onPauseResume, onCancel, onFinish, onKeepGoing, goalTitle, subText }) {
  const mins = String(Math.floor(timer.seconds / 60)).padStart(2, "0");
  const secs = String(timer.seconds % 60).padStart(2, "0");
  const pct = 1 - timer.seconds / timer.total;
  const vh = useVisibleHeight();

  return (
    <div
      className="fixed left-0 right-0 top-0 z-50 flex items-center justify-center px-6 overflow-y-auto"
      style={{ height: vh, background: "#211F3A", paddingTop: "env(safe-area-inset-top)", paddingBottom: "env(safe-area-inset-bottom)" }}
    >
      <div className="w-full max-w-sm text-center">
        {!timer.done ? (
          <>
            <p className="text-xs font-semibold uppercase tracking-wide mb-1" style={{ color: "#9891C4" }}>{goalTitle}</p>
            <p className="text-sm mb-8" style={{ color: "#C9C3EE" }}>{subText}</p>

            <div className="relative w-56 h-56 mx-auto mb-8">
              <svg className="w-full h-full -rotate-90" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="45" fill="none" stroke="#3A3660" strokeWidth="6" />
                <circle
                  cx="50" cy="50" r="45" fill="none" stroke="#FF7A59" strokeWidth="6"
                  strokeDasharray={2 * Math.PI * 45}
                  strokeDashoffset={2 * Math.PI * 45 * (1 - pct)}
                  strokeLinecap="round"
                  style={{ transition: "stroke-dashoffset 1s linear" }}
                />
              </svg>
              <div className="absolute inset-0 flex items-center justify-center">
                <span className="font-mono text-5xl font-bold text-white">{mins}:{secs}</span>
              </div>
            </div>

            <div className="flex items-center justify-center gap-3">
              <button onClick={onCancel} className="px-5 py-3 rounded-2xl text-sm font-semibold" style={{ background: "#3A3660", color: "#C9C3EE" }}>
                やめる
              </button>
              <button onClick={onPauseResume} className="flex items-center gap-2 px-6 py-3 rounded-2xl text-sm font-display font-semibold text-white" style={{ background: "#6C5CE7" }}>
                {timer.running ? <><Pause size={16} /> 一時停止</> : <><Play size={16} /> 再開</>}
              </button>
            </div>
          </>
        ) : (
          <div className="animate-pop">
            <div className="w-20 h-20 rounded-full mx-auto mb-5 flex items-center justify-center" style={{ background: "#2EC4B6" }}>
              <Check size={36} color="white" strokeWidth={3} />
            </div>
            <h2 className="font-display text-2xl font-semibold text-white mb-2">時間終了!</h2>
            <p className="text-sm mb-8" style={{ color: "#C9C3EE" }}>このステップ、完了にする?</p>
            <div className="flex items-center justify-center gap-3">
              <button onClick={onKeepGoing} className="flex items-center gap-2 px-5 py-3 rounded-2xl text-sm font-semibold" style={{ background: "#3A3660", color: "#C9C3EE" }}>
                <RotateCcw size={15} /> まだ途中
              </button>
              <button onClick={onFinish} className="flex items-center gap-2 px-6 py-3 rounded-2xl text-sm font-display font-semibold text-white" style={{ background: "#2EC4B6" }}>
                <Check size={16} /> 完了にする
              </button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ---------- Add to Home Screen guide ----------
function detectPlatform() {
  if (typeof navigator === "undefined") return "other";
  const ua = navigator.userAgent || "";
  const isIOS = /iPad|iPhone|iPod/.test(ua) || (ua.includes("Macintosh") && navigator.maxTouchPoints > 1);
  if (isIOS) return "ios";
  if (/Android/.test(ua)) return "android";
  return "other";
}

// ---------- Celebration toast ----------
function Celebration({ text }) {
  return (
    <div className="fixed top-20 left-1/2 -translate-x-1/2 z-50 px-5 py-3 rounded-2xl flex items-center gap-2 animate-pop" style={{ background: "#211F3A", boxShadow: "0 8px 24px rgba(33,31,58,0.3)" }}>
      <Sparkles size={16} color="#FFD166" />
      <span className="text-sm font-medium text-white">「{text}」が一歩前進!</span>
    </div>
  );
}

// ---------- Undo delete toast ----------
function UndoToast({ message, icon, onUndo, onDismiss }) {
  const ToastIcon = icon || Trash2;
  return (
    <div
      className="fixed left-5 right-5 z-40 flex items-center justify-between gap-3 px-4 py-3.5 rounded-2xl animate-descend"
      style={{
        bottom: "calc(5.75rem + env(safe-area-inset-bottom))",
        background: "#211F3A",
        boxShadow: "0 8px 24px rgba(33,31,58,0.3)",
        maxWidth: "28rem",
        margin: "0 auto",
      }}
    >
      <div className="flex items-center gap-2 min-w-0">
        <ToastIcon size={16} color="#B7B0DE" className="shrink-0" />
        <span className="text-sm text-white truncate">{message}</span>
      </div>
      <div className="flex items-center gap-1 shrink-0">
        <button
          onClick={onUndo}
          className="flex items-center gap-1 text-sm font-display font-semibold px-3 py-1.5 rounded-lg transition-colors"
          style={{ background: "#FF7A59", color: "white" }}
        >
          <RotateCcw size={14} /> 元に戻す
        </button>
        <button onClick={onDismiss} aria-label="閉じる" className="p-1.5 rounded-lg hover:bg-white/10">
          <X size={15} color="#726B9E" />
        </button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);


</script>
