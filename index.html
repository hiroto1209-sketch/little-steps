<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="little steps">
<meta name="theme-color" content="#4C3BB8">
<meta name="color-scheme" content="light">
<meta name="description" content="大きな目標を、脳がフリーズしない小さな一歩に分けるSMART目標アプリ">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>little steps — ADHDにやさしいSMART目標アプリ</title>
<script>document.documentElement.classList.add("js");</script>
<style>
:root {
  --bg: #F4F1FB;
  --surface: #FFFFFF;
  --text: #1C1733;
  --soft: #433E5C;
  --muted: #4E4868;
  --violet: #4C3BB8;
  --violet-ink: #3F319A;
  --violet-soft: #EDE9FB;
  --line: #D9D3F0;
  --teal: #0F766E;
  --amber: #8A5A00;
  --amber-soft: #FFF3D6;
  --danger-bg: #FDECE7;
  --danger-ink: #6B3A2E;
  --ink: #1C1733;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --ease: cubic-bezier(0.33, 1, 0.68, 1);
  --back: cubic-bezier(0.34, 1.56, 0.64, 1);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  min-height: 100%;
  background:
    radial-gradient(900px 420px at 50% -12%, #E3DCFB 0%, transparent 58%),
    linear-gradient(180deg, #F7F4FF 0%, var(--bg) 42%, #F7F4F1 100%);
  color: var(--text);
  font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic Medium", "Yu Gothic", "Noto Sans JP", "WenQuanYi Micro Hei", sans-serif;
  font-size: 16px;
  line-height: 1.6;
  -webkit-text-size-adjust: 100%;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; padding: 0; touch-action: manipulation; }
button:disabled { cursor: default; }
[hidden] { display: none !important; }
:focus:not(:focus-visible) { outline: none; }
:focus-visible { outline: 3px solid var(--violet); outline-offset: 3px; }
::placeholder { color: var(--muted); opacity: 1; }
::selection { background: #DDD6FE; color: var(--text); }
.skip {
  position: absolute; left: 12px; top: -48px; z-index: 100;
  background: #fff; color: var(--violet-ink); font-weight: 700;
  padding: 10px 14px; border-radius: 12px;
}
.skip:focus { top: calc(12px + var(--safe-t)); }
#app { max-width: 520px; margin: 0 auto; }
header {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: calc(12px + var(--safe-t)) 20px 12px;
  background: rgba(244, 241, 251, 0.94);
}
@supports (backdrop-filter: blur(12px)) {
  header { background: rgba(244, 241, 251, 0.78); backdrop-filter: blur(12px); }
}
.h-left, .h-right, .h-stats { display: flex; align-items: center; gap: 8px; min-width: 0; }
.logo {
  width: 36px; height: 36px; border-radius: 12px; background: var(--violet); flex: none;
  display: grid; grid-template-columns: repeat(3, 6px); gap: 3px; place-content: center;
}
.logo i { width: 6px; height: 6px; border-radius: 50%; background: #fff; display: block; }
.logo i:nth-child(1) { opacity: 0.45; }
.logo i:nth-child(2) { opacity: 0.72; }
h1 { font-size: 1.15rem; line-height: 1.2; margin: 0; font-weight: 700; }
.icon-btn {
  width: 44px; height: 44px; border-radius: 50%; background: var(--violet-soft); color: var(--violet-ink);
  display: grid; place-items: center; flex: none;
}
.lifetime, .streak {
  display: flex; align-items: baseline; gap: 2px;
  border-radius: 999px; padding: 4px 10px; background: var(--violet-soft); color: var(--violet-ink);
  font-weight: 700; font-size: 0.78rem; white-space: nowrap;
}
.lifetime strong { font-size: 1rem; font-variant-numeric: tabular-nums; }
.streak.is-live { background: var(--amber-soft); color: var(--amber); }
main { padding: 8px 20px 40px; }
.card {
  background: var(--surface);
  border: 1px solid rgba(76, 59, 184, 0.1);
  border-radius: 28px;
  padding: 22px 20px 18px;
  box-shadow: 0 12px 40px rgba(60, 40, 120, 0.06);
}
.kicker { margin: 0 0 6px; color: var(--violet-ink); font-weight: 700; font-size: 0.82rem; }
.goal-title, .empty h2 { margin: 0; font-size: clamp(1.45rem, 5vw, 1.85rem); line-height: 1.4; font-weight: 700; }
.lead { color: var(--soft); margin: 10px 0 18px; }
.meta-line, .deadline { margin: 8px 0 0; color: var(--soft); font-size: 0.95rem; }
.meta-line span {
  display: block; font-size: 0.75rem; font-weight: 700; color: var(--violet-ink); margin-bottom: 2px;
}
.step-text { margin: 16px 0 12px; font-size: 1.35rem; font-weight: 700; line-height: 1.45; }
.btn-primary {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%; min-height: 56px; padding: 12px 16px; border-radius: 16px;
  background: var(--violet); color: #fff; font-weight: 700; font-size: 1.05rem;
  transition: background-color 180ms var(--ease), filter 180ms var(--ease), transform 120ms var(--ease);
}
.btn-primary:active { transform: scale(0.98); }
.btn-primary:disabled { background: #E4DFF6; color: var(--muted); transform: none; }
.btn-primary.is-done { background: var(--teal); }
.btn-secondary, .chip, .mini-btn, .footer-back, .tbtn.quiet {
  min-height: 44px; border-radius: 12px; font-weight: 700; color: var(--violet-ink); background: var(--violet-soft);
}
.btn-secondary { padding: 0 14px; }
.chip { padding: 0 14px; border-radius: 999px; }
.mini-btn, .footer-back { padding: 0 10px; background: transparent; }
.linkish {
  display: inline-flex; align-items: center; justify-content: center;
  min-height: 44px; padding: 8px 12px; width: 100%;
  color: var(--violet-ink); font-weight: 700; text-decoration: underline; text-underline-offset: 3px;
}
.release { color: var(--soft); font-weight: 500; text-decoration-thickness: 1px; }
.check-pop { display: grid; place-items: center; }
.check-disc { fill: none; stroke: currentColor; stroke-width: 2; }
.check-mark {
  fill: none; stroke: currentColor; stroke-width: 2.6;
  stroke-linecap: round; stroke-linejoin: round;
  stroke-dasharray: 32; stroke-dashoffset: 32;
}
.box {
  width: 44px; height: 44px; flex: none; border-radius: 50%;
  border: 2px solid var(--violet); background: #fff; color: var(--violet);
  display: grid; place-items: center;
}
.box svg { width: 22px; height: 22px; }
.btn-primary svg { width: 26px; height: 26px; }
.box.is-done { background: var(--teal); border-color: var(--teal); color: #fff; }
.btn-primary.is-done .check-pop,
.box.is-done:not(.is-static) { animation: pop 280ms var(--back); }
.btn-primary.is-done .check-mark,
.box.is-done:not(.is-static) .check-mark { animation: draw 240ms var(--ease) forwards; }
.btn-primary.is-done .check-disc { fill: #fff; stroke: #fff; }
.btn-primary.is-done .check-mark { stroke: var(--teal); }
.box.is-done.is-static .check-mark { animation: none; stroke-dashoffset: 0; }
.reward-badge.box.is-done { animation: none; transform: none; width: 32px; height: 32px; pointer-events: none; }
.reward-badge.box.is-done .check-mark { animation: draw 240ms var(--ease) forwards; }
.progress-block { margin-top: 16px; }
.bar {
  position: relative; height: 12px; border-radius: 999px; background: var(--violet-soft); overflow: hidden;
}
.bar-done, .bar-next { position: absolute; top: 0; bottom: 0; left: 0; }
.bar-done {
  background: var(--violet); width: 0; z-index: 1; border-radius: inherit;
  transition: width 450ms var(--ease);
}
.bar-next {
  background: #C9BEF4; width: 0; z-index: 0;
  transition: width 450ms var(--ease), left 450ms var(--ease);
}
.bar.mini { height: 8px; margin: 4px 0 12px; }
.bar-caption { margin: 8px 0 0; font-weight: 700; color: var(--violet-ink); font-size: 0.95rem; }
.presets { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 0 8px; }
.presets-label { width: 100%; margin: 0; color: var(--soft); font-size: 0.88rem; font-weight: 700; }
.fold {
  background: #fff; border: 1px solid rgba(76, 59, 184, 0.1); border-radius: 20px;
  padding: 0 16px; margin-top: 12px;
}
.card .fold { box-shadow: none; }
summary {
  display: grid; grid-template-columns: 1fr auto; grid-template-areas: "text chev" "peek peek";
  gap: 2px 8px; align-items: center; min-height: 52px; padding: 12px 0; cursor: pointer; list-style: none;
}
summary::-webkit-details-marker { display: none; }
.sum-text { grid-area: text; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.sum-main { font-weight: 700; }
.sum-meta { color: var(--violet-ink); font-weight: 700; font-size: 0.85rem; white-space: nowrap; }
.peek { grid-area: peek; color: var(--soft); font-size: 0.9rem; }
.chev {
  grid-area: chev; width: 10px; height: 10px; justify-self: end;
  border-right: 2px solid var(--violet-ink); border-bottom: 2px solid var(--violet-ink);
  transform: rotate(45deg); transition: transform 200ms var(--ease);
}
details[open] > summary .chev { transform: rotate(225deg); }
.steps, .archive-list, .hints, .hist { list-style: none; margin: 0; padding: 0; }
.steps { display: flex; flex-direction: column; gap: 8px; padding-bottom: 14px; }
.step { display: flex; align-items: center; gap: 10px; min-height: 44px; }
.step-label { color: var(--text); }
.step.is-done .step-label { color: var(--soft); }
.note-label { display: block; margin-top: 16px; font-weight: 700; font-size: 0.92rem; }
.note-label textarea, .field textarea, input[type="date"], input[type="text"] {
  width: 100%; margin-top: 6px; border: 2px solid var(--line); border-radius: 14px;
  padding: 12px 14px; background: #fff; color: var(--text); line-height: 1.5; font-weight: 400;
}
.opt { color: var(--soft); }
.section-label { font-size: 0.95rem; margin: 22px 4px 0; }
.fold-body { padding-bottom: 8px; }
.archive-list { display: flex; flex-direction: column; gap: 4px; padding-bottom: 8px; }
.archive-item { display: flex; align-items: center; gap: 4px; min-height: 44px; }
.archive-title { flex: 1; min-width: 0; }
.hist { display: flex; flex-direction: column; gap: 8px; padding-bottom: 8px; }
.hist div { display: flex; justify-content: space-between; gap: 12px; }
.hist dt { color: var(--soft); font-weight: 500; }
.hist dd { margin: 0; font-weight: 700; }
.hist-note { color: var(--soft); font-size: 0.9rem; margin: 0 0 14px; }
.hints { counter-reset: hint; display: flex; flex-direction: column; gap: 8px; margin-top: 18px; }
.hints li { counter-increment: hint; display: flex; align-items: center; gap: 10px; }
.hints li::before {
  content: counter(hint); width: 28px; height: 28px; flex: none; border-radius: 50%;
  display: grid; place-items: center; background: var(--violet-soft); color: var(--violet-ink);
  font-weight: 700; font-size: 0.8rem;
}
#create-wrap { display: flex; justify-content: center; padding-top: 8px; }
#dock {
  position: fixed; z-index: 30; left: 50%; bottom: calc(12px + var(--safe-b));
  width: min(480px, calc(100% - 32px));
  opacity: 0; pointer-events: none; transform: translateX(-50%) translateY(16px);
  transition: opacity 450ms var(--ease), transform 450ms var(--ease);
}
#dock.is-on { opacity: 1; pointer-events: auto; transform: translateX(-50%); }
body.dock-on { padding-bottom: calc(108px + var(--safe-b)); }
body.modal-open { overflow: hidden; }
.reward, .toast {
  position: fixed; z-index: 70; left: 50%; width: min(480px, calc(100% - 24px));
  transform: translateX(-50%); visibility: hidden;
}
.reward { top: calc(72px + var(--safe-t)); }
.reward.is-in { visibility: visible; animation: rewardIn 280ms var(--back) both; }
.reward-card, .toast {
  display: flex; align-items: center; gap: 10px;
  background: var(--ink); color: #fff; border-radius: 16px; padding: 12px 12px 12px 14px;
  box-shadow: 0 10px 30px rgba(28, 23, 51, 0.28);
}
.toast {
  position: fixed; bottom: calc(16px + var(--safe-b)); visibility: visible; z-index: 65;
}
body.dock-on .toast { bottom: calc(108px + var(--safe-b)); }
.reward-card p, .toast p { flex: 1; margin: 0; color: #fff; font-weight: 700; line-height: 1.45; }
.reward-undo, .toast button {
  flex: none; min-height: 44px; padding: 0 12px; border-radius: 10px;
  background: #fff; color: var(--violet-ink); font-weight: 700;
}
.save-error {
  position: fixed; z-index: 80; left: 16px; right: 16px; bottom: calc(16px + var(--safe-b));
  margin: 0 auto; max-width: 480px; background: var(--danger-bg); color: var(--danger-ink);
  padding: 12px 14px; border-radius: 12px; font-weight: 700;
}
.overlay {
  position: fixed; inset: 0; z-index: 60; background: rgba(28, 23, 51, 0.46);
  display: flex; justify-content: center; align-items: flex-end;
}
.overlay.is-timer { background: var(--ink); align-items: center; padding: 24px 16px; }
.modal-card {
  width: 100%; max-width: 520px; max-height: 96%; overflow: auto; background: #fff;
  border-radius: 24px 24px 0 0; position: relative;
  animation: rise 450ms var(--ease);
}
.modal-close {
  position: absolute; top: 12px; right: 12px; width: 44px; height: 44px; border-radius: 50%;
  color: var(--violet-ink); font-weight: 700; font-size: 1.25rem;
}
.modal-body { padding: 22px 20px 8px; }
.modal-footer {
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding: 12px 20px calc(12px + var(--safe-b)); border-top: 1px solid #E4DFF6;
  position: sticky; bottom: 0; background: #fff;
}
.modal-footer .btn-primary { width: auto; min-width: 9.5rem; }
.dots { display: flex; gap: 6px; margin: 0 48px 10px 0; }
.dot { flex: 1; height: 6px; border-radius: 999px; background: #E4DFF6; }
.dot.is-on { background: var(--violet); }
.wizard-left { margin: 0 0 8px; color: var(--violet-ink); font-weight: 700; font-size: 0.88rem; }
.eyebrow { margin: 0; color: var(--violet-ink); font-weight: 700; font-size: 0.78rem; }
.guide-icon {
  width: 64px; height: 64px; margin: 8px auto 12px; border-radius: 20px;
  display: grid; place-items: center; background: var(--violet); color: #fff;
  font-weight: 700; font-size: 1.4rem;
}
#wizard-prompt, .install-title { margin: 4px 0; font-size: 1.35rem; line-height: 1.4; }
.hint { margin: 0 0 14px; color: var(--soft); }
.sub-add { display: flex; gap: 8px; align-items: center; }
.sub-add input { margin-top: 0; }
.sub-count { color: var(--soft); font-size: 0.88rem; min-height: 1.4em; }
.chip-row {
  display: flex; align-items: center; gap: 8px; min-height: 44px;
  background: var(--bg); border-radius: 12px; padding: 8px 8px 8px 12px; margin-top: 8px;
}
.chip-n { width: 1.4rem; color: var(--violet-ink); font-weight: 700; }
.chip-t { flex: 1; }
.guide-step {
  display: flex; gap: 12px; align-items: center; background: var(--bg);
  border-radius: 14px; padding: 12px; margin-top: 8px;
}
.guide-n {
  width: 32px; height: 32px; flex: none; border-radius: 50%; background: #fff;
  color: var(--violet-ink); display: grid; place-items: center; font-weight: 700;
}
.guide-done { width: 100%; margin-top: 16px; }
.timer-wrap { width: min(100%, 420px); text-align: center; color: #fff; }
.timer-kicker { margin: 0; color: #D9D3F0; font-size: 0.82rem; font-weight: 700; }
.timer-title { margin: 6px 0; font-size: 1.35rem; line-height: 1.4; }
.timer-sub { margin: 0 0 18px; color: #E4DFF6; }
.timer-ring { position: relative; width: 220px; height: 220px; margin: 0 auto 20px; }
.timer-time {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-size: 3rem; font-weight: 700; font-variant-numeric: tabular-nums; color: #fff;
}
.timer-actions { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
.tbtn { min-height: 48px; padding: 0 16px; border-radius: 14px; font-weight: 700; }
.tbtn.quiet { background: #3A3458; color: #fff; }
.timer-primary { width: auto; min-width: 9rem; }
.noscript { max-width: 520px; margin: 24px auto; padding: 0 20px; }
@keyframes rise {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: none; }
}
@keyframes fade {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes pop {
  from { transform: scale(0.82); }
  to { transform: scale(1); }
}
@keyframes draw {
  from { stroke-dashoffset: 32; }
  to { stroke-dashoffset: 0; }
}
@keyframes rewardIn {
  from { opacity: 0; transform: translateX(-50%) translateY(8px) scale(0.92); }
  to { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
}
@keyframes rewardFade {
  from { opacity: 0; transform: translateX(-50%); }
  to { opacity: 1; transform: translateX(-50%); }
}
.js .reveal {
  opacity: 0;
  animation-name: rise;
  animation-duration: 450ms;
  animation-timing-function: var(--ease);
  animation-fill-mode: forwards;
  animation-delay: calc(var(--i, 0) * 60ms);
}
.step-enter { animation: rise 450ms var(--ease); }
@media (min-width: 720px) {
  .overlay { align-items: center; padding: 24px; }
  .modal-card { border-radius: 24px; }
}
@media (prefers-reduced-motion: reduce) {
  .js .reveal { animation-name: fade; transform: none; }
  .step-enter, .modal-card { animation-name: fade; }
  .btn-primary.is-done .check-pop,
  .box.is-done:not(.is-static) { animation: none; }
  .btn-primary:active, .box:active, .chip:active { transform: none; filter: brightness(1.08); }
  .chev, .bar-done, .bar-next { transition: none; }
  #dock { transition: opacity 450ms ease; transform: translateX(-50%); }
  #dock.is-on { transform: translateX(-50%); }
  .reward.is-in { animation-name: rewardFade; }
}
@media (forced-colors: active) {
  .btn-primary, .box, .bar { border: 1px solid ButtonText; }
}
</style>
</head>
<body>
<a class="skip" href="#main">内容へスキップ</a>
<div id="app">
  <header>
    <div class="h-left">
      <span class="logo" aria-hidden="true"><i></i><i></i><i></i></span>
      <h1>little steps</h1>
    </div>
    <div class="h-right">
      <button type="button" id="install-btn" class="icon-btn" data-action="install" aria-label="ホーム画面に追加" hidden>
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2"></rect><path d="M11 18h2"></path></svg>
      </button>
      <div class="h-stats">
        <p id="stat-steps-wrap" class="lifetime" hidden><strong id="stat-steps">0</strong><span>歩</span></p>
        <p id="stat-streak" class="streak" hidden></p>
      </div>
    </div>
  </header>
  <main id="main" tabindex="-1">
    <section id="today" class="reveal" style="--i:0"></section>
    <section id="others" class="reveal" style="--i:1" hidden></section>
    <section id="archive" class="reveal" style="--i:2" hidden></section>
    <section id="history" class="reveal" style="--i:3" hidden></section>
    <div id="create-wrap" class="reveal" style="--i:4" hidden></div>
  </main>
</div>
<div id="dock" aria-hidden="true">
  <button type="button" id="dock-cta" class="btn-primary" tabindex="-1" data-action="mirror-hero"><span id="dock-label">最初の一歩をつくる</span></button>
</div>
<div id="reward" class="reward" role="status" aria-live="polite" aria-atomic="true" aria-hidden="true"></div>
<div id="toasts" aria-live="polite"></div>
<p id="save-error" class="save-error" role="alert" hidden>保存に失敗しました。容量や設定を確認して、もう一度試してください。</p>
<div id="overlay"></div>
<noscript>
  <div class="noscript card">
    <h2>little steps</h2>
    <p>このアプリはJavaScriptで動きます。ブラウザの設定で有効にして、もう一度開いてください。</p>
  </div>
</noscript>
<script>
'use strict';
/* Completing a step patches only the affected row, progress, and header.
   The goal list is not rebuilt, so focus, drafts, and open disclosures stay. */
var STORAGE_KEY = 'little-steps-data';
var TIMER_PRESETS = [5, 15, 25, 30, 40];
var REWARDS = [
  'その一歩、残った。',
  '小さくても、前進。',
  'できた、を記録した。',
  '今日の自分に、一つ渡せた。',
  'その大きさで、ちょうどいい。',
  '完璧じゃなくていい。進んだ。'
];
var WIZARD_STEPS = [
  { key: 'specific', eyebrow: 'S', label: 'Specific', prompt: '何を達成したい?', hint: 'できるだけ具体的に、一文で。書き始めた時点で、もう動き出している。', optional: false, max: 80, rows: 2 },

  if (!btn) return;
  if (btn === ui.justAnimated) {
    btn.setAttribute('data-action', sub.done ? 'undo-step' : 'complete');
    btn.setAttribute('aria-label', stepAria(sub));
    return;
  }
  li.classList.toggle('is-done', !!sub.done);
  btn.classList.toggle('is-done', !!sub.done);
  btn.classList.toggle('is-static', !!sub.done);
  btn.setAttribute('data-action', sub.done ? 'undo-step' : 'complete');
  btn.setAttribute('aria-label', stepAria(sub));
}
function syncTodayFoldMeta(goal, heroId) {

  var left = others.filter(function (s) { return !s.done; }).length;

  if (!fold) {
    var html = todayFoldHTML(goal, heroId);
    var note = document.querySelector('#today-card .note-label');
    if (note) note.insertAdjacentHTML('beforebegin', html);
    else $('today-card').insertAdjacentHTML('beforeend', html);
    return;

  var list = fold.querySelector('.steps');
  var ids = {};

    ids[s.id] = true;
    var li = list.querySelector(attrSel('data-step', s.id));
    if (!li) {
      var holder = document.createElement('template');
      holder.innerHTML = stepRowHTML(goal, s);
      list.insertBefore(holder.content.firstElementChild, list.children[i] || null);
    } else {

      syncDoneRow(li, s);
    }

  if (peek) peek.textContent = n ? ('次は「' + truncate(n.text, 18) + '」') : '';
  var list = root.querySelector('.steps');
  if (!list) return;
  goal.subtasks.forEach(function (s) {
    var li = list.querySelector(attrSel('data-step', s.id));

function deleteGoal(id) {

function wizardBack() {

  if (ui.wizard.step === 0) { closeOverlay(); return; }
  ui.wizard.step -= 1;
  paintWizard();
}
function wizardNext() {
  var step = WIZARD_STEPS[ui.wizard.step];
  if (step.key === 'subtasks') {
    var draft = $('sub-draft');
    if (draft && draft.value.trim()) {
      ui.wizard.data.subtasks.push(draft.value.trim());
      draft.value = '';
    }
    if (!ui.wizard.data.subtasks.length) return;
  } else {
    readWizardField();
    if (!step.optional && !String(ui.wizard.data[step.key] || '').trim()) return;

  ui.timer = { goalId: goalId, subId: subId, total: minutes * 60, seconds: minutes * 60, running: true, endsAt: Date.now() + minutes * 60000 };
  ui.returnFocus = document.activeElement;

  if (!ui.timer || !ui.timer.running) return;

  if (left <= 0) { timerFinished(); return; }
  paintTimerDigits();

  }
  var circle = $('timer-circle');
  if (circle) {
    var circ = 2 * Math.PI * 45;
    var pct = 1 - (t.seconds / t.total);
    circle.setAttribute('stroke-dashoffset', String(circ * (1 - pct)));
  }
}

      '<circle cx="50" cy="50" r="45" fill="none" stroke="#3A3458" stroke-width="6"></circle>' +
      '<circle id="timer-circle" cx="50" cy="50" r="45" fill="none" stroke="#F3C1B6" stroke-width="6" stroke-linecap="round" stroke-dasharray="' + circ + '" stroke-dashoffset="' + (circ * (1 - pct)) + '"></circle></svg>' +
      '<div class="timer-time" id="timer-time"></div></div>' +

  var goal = findGoal(ui.timer.goalId);
  var sub = goal && goal.subtasks.find(function (s) { return s.id === ui.timer.subId; });
  $('overlay').innerHTML = '<div class="overlay is-timer"><div class="timer-wrap" role="dialog" aria-modal="true" aria-labelledby="timer-done-title">' +
    '<h2 class="timer-title" id="timer-done-title">時間になった</h2>' +
    '<p class="timer-sub">' + esc(sub ? sub.text : '') + '<br>区切れたところまでで、完了にできる。途中なら、そのままでいい。</p>' +
    '<div class="timer-actions"><button type="button" class="tbtn quiet" data-action="timer-keep">まだ途中</button>' +
    '<button type="button" id="timer-done" class="tbtn btn-primary timer-primary" data-check data-action="timer-finish"><span class="check-pop">' + CHECK_SVG + '</span><span class="cta-label">完了にする</span></button></div></div></div>';
  $('timer-done').focus();
}
function pauseTimer() {
  if (!ui.timer) return;
  if (ui.timer.running) {
    ui.timer.running = false;
    ui.timer.seconds = Math.max(0, Math.round((ui.timer.endsAt - Date.now()) / 1000));
  } else {
    ui.timer.running = true;
    ui.timer.endsAt = Date.now() + ui.timer.seconds * 1000;
  }
  var btn = $('timer-pause');
  if (btn) btn.textContent = ui.timer.running ? '一時停止' : '再開';
}
function cancelTimer() {
  clearInterval(ui.timerId);
  ui.timer = null;
  closeOverlay();
}
function keepTimer() {
  clearInterval(ui.timerId);
  ui.timer = null;
  showReward('続きは、あとででいい。', false, true);
  closeOverlay();
}
function finishTimer() {
  if (!ui.timer) return;
  var goalId = ui.timer.goalId, subId = ui.timer.subId;
  var btn = $('timer-done');
  clearInterval(ui.timerId);
  ui.timer = null;
  completeStep(goalId, subId, btn);
  window.setTimeout(function () {
    if (ui.overlayKind === 'timer-done' || ui.overlayKind === 'timer') closeOverlay();
  }, 700);
}

function isStandalone() {
  try { return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true; }
  catch (e) { return false; }
}
function detectPlatform() {
  var ua = navigator.userAgent || '';
  if (/iPad|iPhone|iPod/.test(ua) || (ua.indexOf('Macintosh') > -1 && navigator.maxTouchPoints > 1)) return 'ios';
  if (/Android/.test(ua)) return 'android';
  return 'other';
}
function openInstall() {
  ui.returnFocus = document.activeElement;
  ui.overlayKind = 'install';
  document.body.classList.add('modal-open');
  var steps = {
    ios: ['画面下（または上）の共有ボタンをタップ', '「ホーム画面に追加」を選ぶ', '右上の「追加」をタップして完了'],
    android: ['右上の「⋮」メニューを開く', '「ホーム画面に追加」または「アプリをインストール」を選ぶ', '「追加」をタップして完了'],
    other: ['ブラウザのメニューを開く', '「ホーム画面に追加」に近い項目を探す', '案内に沿って追加すれば完了']
  }[detectPlatform()];
  $('overlay').innerHTML = '<div class="overlay"><div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="install-title">' +
    '<button type="button" class="modal-close" data-action="close-overlay" aria-label="閉じる">×</button>' +
    '<div class="modal-body"><div class="guide-icon" aria-hidden="true">＋</div><h2 class="install-title" id="install-title">ホーム画面に追加する</h2>' +
    '<p class="hint">アイコンから開けるようになる。ブラウザを探す手間が、開始のハードルを一つ減らす。</p>' +
    steps.map(function (text, i) { return '<div class="guide-step"><div class="guide-n">' + (i + 1) + '</div><div>' + text + '</div></div>'; }).join('') +
    '<button type="button" class="btn-primary guide-done" data-action="close-overlay">わかった</button></div></div></div>';
  syncDock();
}

function syncDockLabel() {
  var hero = $('hero-cta');
  var label = $('dock-label');
  var dockBtn = $('dock-cta');
  if (!hero || !label || !dockBtn) return;
  var text = (hero.querySelector('.cta-label') || hero).textContent.trim();
  label.textContent = text;
  var step = document.querySelector('#featured-step .step-text');
  dockBtn.setAttribute('aria-label', hero.getAttribute('data-action') === 'complete' && step ? (text + '。' + step.textContent) : text);
}
function syncDock() {
  var dock = $('dock');
  var btn = $('dock-cta');
  var hero = $('hero-cta');
  if (!dock || !btn) return;
  if (ui.overlayKind || !hero) {
    dock.classList.remove('is-on');
    dock.setAttribute('aria-hidden', 'true');
    btn.tabIndex = -1;
    document.body.classList.remove('dock-on');
    return;
  }
  var rect = hero.getBoundingClientRect();
  var inView = rect.bottom > 8 && rect.top < window.innerHeight - 8 && rect.width > 0 && rect.height > 0;
  var on = !inView;
  if (!on && document.activeElement === btn && hero) hero.focus();
  dock.classList.toggle('is-on', on);
  dock.setAttribute('aria-hidden', on ? 'false' : 'true');
  btn.tabIndex = on ? 0 : -1;
  document.body.classList.toggle('dock-on', on);
  syncDockLabel();
}
function observeHero() {
  if (ui.heroIO) ui.heroIO.disconnect();
  var hero = $('hero-cta');
  syncDockLabel();
  if (!hero) { syncDock(); return; }
  ui.heroIO = new IntersectionObserver(function () { syncDock(); }, { threshold: 0 });
  ui.heroIO.observe(hero);
  syncDock();
}

function onAction(el) {
  var action = el.getAttribute('data-action');
  if (action === 'complete') completeStep(el.getAttribute('data-goal'), el.getAttribute('data-sub'), el);
  else if (action === 'undo-step') undoStep(el.getAttribute('data-goal'), el.getAttribute('data-sub'));
  else if (action === 'undo-last' && ui.lastAction) undoStep(ui.lastAction.goalId, ui.lastAction.subId);
  else if (action === 'open-wizard') openWizard();
  else if (action === 'mirror-hero') {
    var heroBtn = $('hero-cta');
    if (!heroBtn) return;
    ui.mirror = true;
    heroBtn.click();
    ui.mirror = false;
  }
  else if (action === 'toggle-presets') {
    var panel = $('presets');
    if (!panel) return;
    panel.hidden = !panel.hidden;
    el.setAttribute('aria-expanded', panel.hidden ? 'false' : 'true');
  } else if (action === 'start-timer') startTimer(el.getAttribute('data-goal'), el.getAttribute('data-sub'), parseInt(el.getAttribute('data-min'), 10));
  else if (action === 'delete-goal') deleteGoal(el.getAttribute('data-goal'));
  else if (action === 'undo-delete') undoDelete();
  else if (action === 'reopen') reopenGoal(el.getAttribute('data-goal'));
  else if (action === 'make-focus') makeFocus(el.getAttribute('data-goal'));
  else if (action === 'wizard-back') wizardBack();
  else if (action === 'wizard-next') wizardNext();
  else if (action === 'add-sub') addSubtaskDraft();
  else if (action === 'remove-sub') removeSubtaskDraft(parseInt(el.getAttribute('data-i'), 10));
  else if (action === 'close-overlay') closeOverlay();
  else if (action === 'timer-pause') pauseTimer();
  else if (action === 'timer-cancel') cancelTimer();
  else if (action === 'timer-keep') keepTimer();
  else if (action === 'timer-finish') finishTimer();
  else if (action === 'install') openInstall();
}

document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-action]');
  if (!el) return;
  onAction(el);
});
document.addEventListener('input', function (e) {
  if (e.target.id === 'today-note') {
    var goal = featuredGoal();
    if (goal && $('today-card') && $('today-card').getAttribute('data-goal') === goal.id) {
      goal.note = e.target.value;
      saveState();
    }
  }
  if (e.target.id === 'wizard-field' || e.target.id === 'sub-draft') {
    if (e.target.id === 'wizard-field' && ui.wizard) {
      var step = WIZARD_STEPS[ui.wizard.step];
      if (step && step.key !== 'subtasks') ui.wizard.data[step.key] = e.target.value;
    }
    updateWizardNext();
  }
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && e.target && e.target.id === 'sub-draft') { e.preventDefault(); addSubtaskDraft(); return; }
  if (e.key === 'Escape' && (ui.overlayKind === 'wizard' || ui.overlayKind === 'install')) { e.preventDefault(); closeOverlay(); return; }
  if (e.key !== 'Tab' || !ui.overlayKind) return;
  var root = $('overlay');
  var items = Array.prototype.filter.call(root.querySelectorAll('button, [href], input, textarea, select'), isVisibleFocusable);
  if (!items.length) return;
  var first = items[0], last = items[items.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});
if (window.visualViewport) window.visualViewport.addEventListener('resize', applyKeyboardCompact);
window.addEventListener('resize', syncDock);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}

function boot() {
  renderToday();
  renderOthers();
  renderArchive();
  renderHistory();
  renderCreate();
  if (!isStandalone()) $('install-btn').hidden = false;
  observeHero();
}
boot();
</script>
</body>
</html>
